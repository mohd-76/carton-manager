<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Carton Manager Pro</title>

<link rel="icon"
href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">

<style>

:root{
    --bg:#0f172a;
    --card:#1e293b;
    --accent:#22c55e;
    --text:#f8fafc;
    --danger:#ef4444;
    --warning:#eab308;
    --muted:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI,sans-serif;
}

header{
    background:#020617;
    padding:15px;
    text-align:center;
    border-bottom:1px solid #334155;
    position:sticky;
    top:0;
    z-index:100;
}

.container{
    max-width:700px;
    margin:auto;
    padding:15px;
}

.card{
    background:var(--card);
    padding:16px;
    border-radius:14px;
    margin-bottom:15px;
    border:1px solid #334155;
}

h2,h3{
    color:var(--accent);
    margin-bottom:10px;
}

.nav-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:15px;
}

.nav-btn{
    flex:1;
    min-width:100px;
    border:none;
    padding:12px;
    border-radius:10px;
    background:#334155;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.nav-btn.active{
    background:var(--accent);
    color:black;
}

input,
select,
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #334155;
    background:#0f172a;
    color:white;
    font-size:15px;
}

button{
    cursor:pointer;
    border:none;
}

.action-btn{
    background:var(--accent);
    color:black;
    font-weight:bold;
}

.secondary-btn{
    background:#334155;
}

.hidden{
    display:none !important;
}

.loading-screen{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.list-item{
    padding:15px;
    border-bottom:1px solid #334155;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
}

.list-item:hover{
    background:#263548;
}

.small{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
}

.badge{
    background:#3b82f6;
    color:white;
    padding:4px 8px;
    border-radius:6px;
    font-size:11px;
}

.qty-green{
    color:#22c55e;
    font-weight:bold;
}

.qty-yellow{
    color:#eab308;
    font-weight:bold;
}

.qty-red{
    color:#ef4444;
    font-weight:bold;
}

.store-rank{
    font-size:18px;
    color:#22c55e;
    font-weight:bold;
}

.action-row{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.action-row button{
    margin:0;
}

.btn-delete{
    background:#ef4444;
    color:white;
}

.btn-complete{
    background:#22c55e;
    color:black;
}

.btn-edit{
    background:#eab308;
    color:black;
}

.summary-card{
    background:#334155;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    text-align:center;
}

a{
    color:#22c55e;
    text-decoration:none;
}

</style>

</head>

<body>

<div id="loadingPage"
     class="loading-screen">

    <h2>📦 Syncing Data...</h2>

</div>

<div id="loginPage"
     class="loading-screen hidden">

    <h2>📦 Carton Manager Pro</h2>

    <button class="action-btn"
            onclick="login()"
            style="width:250px;">

        Login with Google

    </button>

</div>

<div id="app"
     class="hidden">

<header>

    <strong>Carton Manager Pro</strong>

    <br>

    <small id="userName"></small>

    |

    <a href="#"
       onclick="logout()"
       style="color:#ef4444;">

       Logout

    </a>

</header>

<div class="container">

<div class="nav-tabs">

    <button class="nav-btn active"
            id="btnAdd"
            onclick="switchTab('addStorePage')">

        🏪 Add Store

    </button>

    <button class="nav-btn"
            id="btnNetwork"
            onclick="switchTab('networkPage')">

        🌐 My Network

    </button>

    <button class="nav-btn"
            id="btnUpcoming"
            onclick="switchTab('upcomingPage')">

        ⏱ Upcoming

    </button>

    <button class="nav-btn"
            id="btnCompleted"
            onclick="switchTab('completedPage')">

        ✅ Completed

    </button>

</div>

<!-- ADD STORE -->

<div id="addStorePage"
     class="tab-content">

    <div class="card">

        <h3>+ Add Store</h3>

        <input id="s_name"
               placeholder="Store Name">

        <input id="s_location"
               placeholder="Manual Location">

        <input id="s_maplink"
               placeholder="Google Maps Link">

        <input id="s_phone1"
               type="tel"
               placeholder="Primary Phone">

        <input id="s_phone2"
               type="tel"
               placeholder="Secondary Phone">

        <input id="s_quantity"
               type="number"
               placeholder="Estimated Quantity KG">

        <select id="s_frequency">

            <option value="daily">Daily</option>

            <option value="weekly">Weekly</option>

            <option value="monthly">Monthly</option>

            <option value="custom">Custom</option>

        </select>

        <button class="action-btn"
                id="storeSubmitBtn"
                onclick="addStore()">

            Save Store

        </button>

        <button class="secondary-btn hidden"
                id="cancelEditBtn"
                onclick="cancelStoreEdit()">

            Cancel Edit

        </button>

    </div>

</div>

<!-- NETWORK -->

<div id="networkPage"
     class="tab-content hidden">

    <div class="card">

        <h3>Your Network</h3>

        <input type="text"
               id="searchStore"
               placeholder="Search Store..."
               onkeyup="loadStores()">

        <div id="storesList"></div>

    </div>

</div>

<!-- UPCOMING -->

<div id="upcomingPage"
     class="tab-content hidden">

    <div class="card">

        <h3>Pending Operations</h3>

        <div id="upcomingList"></div>

    </div>

</div>

<!-- COMPLETED -->

<div id="completedPage"
     class="tab-content hidden">

    <div class="card">

        <h3>Completed Pickups</h3>

        <div id="completedList"></div>

    </div>

</div>

<!-- DETAILS -->

<div id="detailsPage"
     class="tab-content hidden">

    <div class="card"
         id="storeInfo"></div>

    <div class="card">

        <h3>Schedule Pickup</h3>

        <input type="datetime-local"
               id="pickupTime">

        <input type="number"
               id="pickupKg"
               placeholder="Estimated Weight (KG)">

        <select id="pickupFreq">

            <option value="one">One Time</option>

            <option value="daily">Daily</option>

            <option value="weekly">Weekly</option>

            <option value="monthly">Monthly</option>

        </select>

        <button class="action-btn"
                onclick="savePickup()">

            Confirm Pickup

        </button>

    </div>

    <div class="card">

        <h3>Store History</h3>

        <div id="historyList"></div>

    </div>

    <button class="secondary-btn"
            onclick="switchTab('networkPage')">

        ← Back To Stores

    </button>

</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    Timestamp,
    doc,
    updateDoc,
    deleteDoc
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
    getAuth,
    GoogleAuthProvider,
    signOut,
    onAuthStateChanged,
    signInWithPopup
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {

    apiKey: "AIzaSyBjp3-51CLlKTP0Gon20_gMPBrdV817JMM",

    authDomain: "carton-manager-2f6fa.firebaseapp.com",

    projectId: "carton-manager-2f6fa",

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

let currentStoreId = null;

let editingStoreId = null;

let allStoresMap = {};

onAuthStateChanged(auth, async(user)=>{

    document.getElementById("loadingPage")
    .classList.add("hidden");

    if(user){

        document.getElementById("loginPage")
        .classList.add("hidden");

        document.getElementById("app")
        .classList.remove("hidden");

        document.getElementById("userName")
        .innerText = user.displayName;

        await cacheStores();

        switchTab("networkPage");

    }else{

        document.getElementById("loginPage")
        .classList.remove("hidden");

    }

});

window.login = async()=>{

    await signInWithPopup(auth,provider);

};

window.logout = ()=>signOut(auth);

async function cacheStores(){

    const snap = await getDocs(
        query(
            collection(db,"stores"),
            where("userId","==",auth.currentUser.uid)
        )
    );

    allStoresMap = {};

    snap.forEach(docSnap=>{

        allStoresMap[docSnap.id] =
        docSnap.data().name;

    });

}

window.switchTab = (tabId)=>{

    document.querySelectorAll(".tab-content")
    .forEach(tab=>tab.classList.add("hidden"));

    document.getElementById(tabId)
    .classList.remove("hidden");

    document.querySelectorAll(".nav-btn")
    .forEach(btn=>btn.classList.remove("active"));

    if(tabId==="addStorePage")
    document.getElementById("btnAdd")
    .classList.add("active");

    if(tabId==="networkPage")
    document.getElementById("btnNetwork")
    .classList.add("active");

    if(tabId==="upcomingPage")
    document.getElementById("btnUpcoming")
    .classList.add("active");

    if(tabId==="completedPage")
    document.getElementById("btnCompleted")
    .classList.add("active");

    if(tabId==="networkPage")
    loadStores();

    if(tabId==="upcomingPage")
    loadUpcoming();

    if(tabId==="completedPage")
    loadCompleted();

};

window.addStore = async()=>{

    const name =
    document.getElementById("s_name").value;

    const location =
    document.getElementById("s_location").value;

    const maplink =
    document.getElementById("s_maplink").value;

    const phone1 =
    document.getElementById("s_phone1").value;

    const phone2 =
    document.getElementById("s_phone2").value;

    const quantity =
    document.getElementById("s_quantity").value;

    const frequency =
    document.getElementById("s_frequency").value;

    if(!name || !location || !phone1 || !quantity){

        return alert("Fill all required fields");

    }

    const storeData = {

        name,
        location,
        maplink,
        phone1,
        phone2,
        quantity:Number(quantity),
        frequency,
        userId:auth.currentUser.uid,

    };

    if(editingStoreId){

        await updateDoc(
            doc(db,"stores",editingStoreId),
            storeData
        );

        alert("Store Updated");

    }else{

        storeData.createdAt = Timestamp.now();

        await addDoc(collection(db,"stores"),storeData);

        alert("Store Added");

    }

    clearStoreForm();

    await cacheStores();

    switchTab("networkPage");

};

function clearStoreForm(){

    editingStoreId = null;

    document.getElementById("s_name").value = "";

    document.getElementById("s_location").value = "";

    document.getElementById("s_maplink").value = "";

    document.getElementById("s_phone1").value = "";

    document.getElementById("s_phone2").value = "";

    document.getElementById("s_quantity").value = "";

    document.getElementById("s_frequency").value = "daily";

    document.getElementById("storeSubmitBtn")
    .innerText = "Save Store";

    document.getElementById("cancelEditBtn")
    .classList.add("hidden");

}

window.cancelStoreEdit = ()=>{

    clearStoreForm();

};

window.editStore = (
    id,
    name,
    location,
    maplink,
    phone1,
    phone2,
    quantity,
    frequency
)=>{

    editingStoreId = id;

    switchTab("addStorePage");

    document.getElementById("s_name").value = name;

    document.getElementById("s_location").value = location;

    document.getElementById("s_maplink").value = maplink;

    document.getElementById("s_phone1").value = phone1;

    document.getElementById("s_phone2").value = phone2;

    document.getElementById("s_quantity").value = quantity;

    document.getElementById("s_frequency").value = frequency;

    document.getElementById("storeSubmitBtn")
    .innerText = "Update Store";

    document.getElementById("cancelEditBtn")
    .classList.remove("hidden");

};

window.deleteStore = async(id)=>{

    const ok =
    confirm("Delete store permanently?");

    if(!ok) return;

    await deleteDoc(doc(db,"stores",id));

    alert("Store Deleted");

    await cacheStores();

    loadStores();

};

function getQtyClass(qty){

    if(qty >= 200) return "qty-green";

    if(qty >= 50) return "qty-yellow";

    return "qty-red";

}

async function loadStores(){

    const list =
    document.getElementById("storesList");

    const snap = await getDocs(
        query(
            collection(db,"stores"),
            where("userId","==",auth.currentUser.uid)
        )
    );

    let stores = [];

    snap.forEach(docSnap=>{

        stores.push({

            id:docSnap.id,
            ...docSnap.data()

        });

    });

    stores.sort((a,b)=>b.quantity-a.quantity);

    list.innerHTML = "";

    stores.forEach((store,index)=>{

        list.innerHTML += `

        <div class="list-item"
             onclick="viewStore(
                '${store.id}',
                '${store.name}',
                '${store.location}',
                '${store.phone1}',
                '${store.phone2}',
                '${store.quantity}',
                '${store.frequency}',
                '${store.maplink}'
             )">

            <div>

                <div class="store-rank">

                    ${index+1}. ${store.name}

                </div>

                <div class="small">

                    📍 ${store.location}

                </div>

                <div class="small">

                    📞 ${store.phone1}

                </div>

                <div class="${getQtyClass(store.quantity)}">

                    📦 ${store.quantity} KG

                </div>

            </div>

            <div style="display:flex;
                        flex-direction:column;
                        gap:8px;">

                <button class="btn-edit"

                onclick="event.stopPropagation();

                editStore(
                    '${store.id}',
                    '${store.name}',
                    '${store.location}',
                    '${store.maplink}',
                    '${store.phone1}',
                    '${store.phone2}',
                    '${store.quantity}',
                    '${store.frequency}'
                )">

                    Edit

                </button>

                <button class="btn-delete"

                onclick="event.stopPropagation();

                deleteStore('${store.id}')">

                    Delete

                </button>

            </div>

        </div>

        `;

    });

}

window.viewStore = async(
    id,
    name,
    location,
    phone1,
    phone2,
    quantity,
    frequency,
    maplink
)=>{

    currentStoreId = id;

    document.querySelectorAll(".tab-content")
    .forEach(tab=>tab.classList.add("hidden"));

    document.getElementById("detailsPage")
    .classList.remove("hidden");

    document.getElementById("storeInfo")
    .innerHTML = `

        <h2>${name}</h2>

        <p>📍 ${location}</p>

        <p>📞 ${phone1}</p>

        <p>📦 ${quantity} KG</p>

        <p>🔁 ${frequency}</p>

        <a href="${maplink}"
           target="_blank">

           📍 Open Google Maps

        </a>

    `;

    loadStoreHistory();

};

window.savePickup = async()=>{

    const time =
    document.getElementById("pickupTime").value;

    const kg =
    document.getElementById("pickupKg").value;

    const freq =
    document.getElementById("pickupFreq").value;

    if(!time || !kg){

        return alert("Fill all fields");

    }

    await addDoc(collection(db,"pickups"),{

        storeId:currentStoreId,
        time,
        kg,
        freq,
        status:"Pending",
        userId:auth.currentUser.uid,
        createdAt:Timestamp.now()

    });

    alert("Pickup Scheduled");

    loadStoreHistory();

};

async function loadStoreHistory(){

    const list =
    document.getElementById("historyList");

    const snap = await getDocs(
        query(
            collection(db,"pickups"),
            where("storeId","==",currentStoreId)
        )
    );

    let pickups = [];

    snap.forEach(docSnap=>{

        pickups.push({

            id:docSnap.id,
            ...docSnap.data()

        });

    });

    pickups.sort((a,b)=>
        new Date(b.time)-new Date(a.time)
    );

    list.innerHTML = "";

    pickups.forEach(p=>{

        const freqBadge =
        p.freq !== "one"
        ?
        `<span class="badge">
            🔁 ${p.freq}
        </span>`
        :
        '';

        list.innerHTML += `

        <div class="card">

            <div class="small">

                ⏳ ${new Date(p.time)
                .toLocaleString()}

            </div>

            <br>

            ${freqBadge}

            <br><br>

            <h3>

                📦 ${p.kg} KG

            </h3>

            <div class="action-row">

                ${
                    p.status !== "Completed"
                    ?
                    `
                    <button class="btn-complete"
                            onclick="markComplete('${p.id}')">

                        Complete

                    </button>
                    `
                    :
                    ''
                }

                <button class="btn-delete"
                        onclick="deletePickup('${p.id}')">

                    Delete

                </button>

            </div>

        </div>

        `;

    });

}

window.markComplete = async(id)=>{

    await updateDoc(doc(db,"pickups",id),{

        status:"Completed"

    });

    loadStoreHistory();

};

window.deletePickup = async(id)=>{

    const ok =
    confirm("Delete Pickup?");

    if(!ok) return;

    await deleteDoc(doc(db,"pickups",id));

    loadStoreHistory();

};

async function loadUpcoming(){

    const list =
    document.getElementById("upcomingList");

    const snap = await getDocs(
        query(
            collection(db,"pickups"),
            where("userId","==",auth.currentUser.uid)
        )
    );

    let pickups = [];

    snap.forEach(docSnap=>{

        const data = docSnap.data();

        if(data.status !== "Completed"){

            pickups.push({

                id:docSnap.id,
                ...data

            });

        }

    });

    pickups.sort((a,b)=>
        new Date(a.time)-new Date(b.time)
    );

    list.innerHTML = "";

    pickups.forEach(p=>{

        const freqBadge =
        p.freq !== "one"
        ?
        `<span class="badge">
            🔁 ${p.freq}
        </span>`
        :
        '';

        list.innerHTML += `

        <div class="card">

            <h2 style="color:#facc15;">

                ${allStoresMap[p.storeId] || "Store"}

            </h2>

            <div class="small">

                📅 ${new Date(p.time)
                .toLocaleString()}

            </div>

            <br>

            ${freqBadge}

            <br><br>

            <h2>

                📦 ${p.kg} KG

            </h2>

            <button class="btn-complete"
                    onclick="markComplete('${p.id}')">

                ✅ Mark Order Complete

            </button>

        </div>

        `;

    });

}

async function loadCompleted(){

    const list =
    document.getElementById("completedList");

    const snap = await getDocs(
        query(
            collection(db,"pickups"),
            where("userId","==",auth.currentUser.uid)
        )
    );

    let pickups = [];

    let total = 0;

    snap.forEach(docSnap=>{

        const data = docSnap.data();

        if(data.status === "Completed"){

            total += Number(data.kg);

            pickups.push({

                id:docSnap.id,
                ...data

            });

        }

    });

    pickups.sort((a,b)=>
        new Date(b.time)-new Date(a.time)
    );

    list.innerHTML = `

        <div class="small"
             style="margin-bottom:10px;">

            Filter by date range

        </div>

        <div style="display:flex;
                    gap:10px;
                    margin-bottom:15px;">

            <input type="date">

            <input type="date">

        </div>

        <div class="summary-card">

            <strong>

                Total Volume:
                ${total} KG

            </strong>

        </div>

    `;

    pickups.forEach(p=>{

        list.innerHTML += `

        <div class="card">

            <div style="
                border-left:4px solid #22c55e;
                padding-left:12px;
            ">

                <h2 style="color:#22c55e;">

                    ${allStoresMap[p.storeId] || "Store"}

                </h2>

                <div class="small">

                    ${new Date(p.time)
                    .toLocaleDateString()}

                </div>

                <br>

                <h3>

                    📦 ${p.kg} KG

                </h3>

            </div>

        </div>

        `;

    });

}

</script>

</body>
</html>
